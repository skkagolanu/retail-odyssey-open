# Public catalogue demo; free instances sleep and do not persist SQLite history.
services:
  - type: web
    name: retail-odyssey-open
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: RO_ENGINE
        value: catalogue
      - key: RO_MAX_INFLIGHT
        value: '1'
      - key: RO_SECURE_COOKIES
        value: 'true'
      - key: RO_ALLOWED_ORIGINS
        sync: false
      - key: RO_TRUSTED_HOSTS
        sync: false
