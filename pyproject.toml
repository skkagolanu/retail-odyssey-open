[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-odyssey-open"
version = "2.0.0"
description = "A local-first, catalogue-grounded fashion assistant"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.163.2", "uvicorn==0.54.0", "httpx==0.28.1",
  "pydantic==2.14.3", "pydantic-settings==2.16.3",
  "Pillow==13.0.0", "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.5", "mypy==2.4.1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
